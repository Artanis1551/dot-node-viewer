name: CI

on:
  push:
    branches:
      - main
      - "stage/**"
  pull_request:
    branches:
      - main

env:
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  build-test-docs:
    name: Build, Test & DocFX (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Build solution (Release, zero warnings)
        run: dotnet build dot-node-viewer.slnx -c Release

      - name: Run TUnit tests (Release)
        run: dotnet test --solution dot-node-viewer.slnx -c Release --no-build

      - name: Generate DocFX C# API metadata (warnings as errors)
        run: dotnet tool run docfx metadata docs/site/docfx.json --warningsAsErrors

      - name: Build DocFX documentation site (warnings as errors)
        run: dotnet tool run docfx build docs/site/docfx.json --warningsAsErrors

